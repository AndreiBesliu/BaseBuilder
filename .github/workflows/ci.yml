name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Poarta NEGATIVA reala: strica pe rand cate o garantie din cod si verifica faptul
  # ca se inroseste EXACT testul scris pentru ea. Fara ea, un test care nu mai
  # exercita nimic arata identic cu unul care apara ceva.
  #
  # A stat in afara CI-ului fiindca CLAUDE.md scria „~50 de minute". Cifra aia n-a
  # fost masurata niciodata. Cronometrata pe 19.09.2026, pe 212 de probe: **5 min
  # 31 s**. Pe un runner de GitHub e de cateva ori mai mult, dar tot e un job de
  # minute, nu de ore — si ruleaza in PARALEL cu `check`, care raporteaza in ~1 min.
  #
  # Cere arborele curat: el restaureaza prin `git checkout --`. Dupa `actions/checkout`
  # e curat prin constructie, ceea ce e tocmai motivul pentru care poate rula aici si
  # nu in `npm run check` (ala se ruleaza cu modificari necomise in arbore).
  mutatii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: toate suitele de mutatii
        run: npm run mutatii

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 23+ ruleaza .ts direct prin strip de tipuri. Fara bundler, fara pas de build.
          # 24 e MINIMUL pe care il sustinem; local se dezvolta pe 26. Prima rulare
          # de CI din viata proiectului a picat exact pe diferenta dintre ele:
          # `node --test tests/` merge pe 26 si incearca sa rezolve `tests` ca MODUL
          # pe 24. Un workflow care n-a rulat niciodata e un fisier, nu o verificare.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Ordinea conteaza: disciplina intai, fiindca e cea mai ieftina si cea mai
      # usor de incalcat. Typecheck-ul dupa, fiindca `npm test` NU verifica tipuri.
      - name: disciplina de determinism in src/sim
        run: npm run discipline

      - name: typecheck
        run: npm run typecheck

      - name: teste
        run: npm test

      # Ieftin si instant: verifica doar ca fiecare proba de mutatie ARE ce sa
      # masoare — tiparul exista in cod, exact o data, si `e` e prefixul unui test
      # care chiar exista. Nu raspunde la „masoara?"; aia e treaba jobului `mutatii`.
      - name: suitele de mutatii sunt intregi
        run: npm run mutatii:check

      - name: masuratori de teren
        run: node src/harness/bench-terrain.ts

      - name: masuratori pe fixtura de gate
        run: node src/harness/bench-fixture.ts

      # Programul care da verdictul lui D1. Fixturile lui sintetice trebuie sa
      # produca fiecare iesire, inclusiv REFUZ. Un program de verdict care nu
      # poate produce rosu n-are dreptul sa produca verde.
      - name: programul de verdict al gate-ului
        run: node tools/gate-verdict.mjs --self-test

      # Documentul de protocol contine cifre, si cifrele se invechesc exact ca un
      # cache fara invalidare. Verificarea asta a fost adaugata DUPA ce un panou a
      # gasit trei derapaje intr-o zi, dintre care unul putea cumpara o amanare
      # nemeritata pe o economie deja cheltuita.
      - name: cifrele din bench/GATE.md corespund codului
        run: node tools/check-gate-numbers.mjs

      # Regresie de determinism pe un scenariu fix. Daca hash-ul se schimba fara
      # ca cineva sa fi vrut asta, build-ul pica aici si nu peste trei luni.
      - name: hash de referinta
        run: |
          OUT=$(node src/harness/cli.ts --seed 12345 --ticks 100000 --agents 40)
          echo "$OUT"
          HASH=$(echo "$OUT" | awk '/^hash/ {print $2}')
          EXPECTED=6ff16b2a
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::hash-ul de referinta s-a schimbat: $HASH (asteptat $EXPECTED)"
            echo "Daca schimbarea e intentionata, actualizeaza EXPECTED in acest workflow"
            echo "si scrie in DEVLOG ce anume a mutat-o."
            exit 1
          fi
